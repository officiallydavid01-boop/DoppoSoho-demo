<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Doppo — Italian cooking in the heart of Soho, London."
    >

    <title>Doppo — Italian Restaurant in Soho</title>

    <!-- CSS -->
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="typography.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="hero.css">
    <link rel="stylesheet" href="animation.css">

</head>

<body>
    <header class="site-header">

    <div class="container header-container">

        <!-- Logo -->
        <a
            href="#"
            class="site-logo"
            aria-label="Doppo home"
        >
            DOPPO
        </a>


        <!-- Desktop Navigation -->
        <nav
            class="main-nav"
            aria-label="Main navigation"
        >

            <a href="#menu">Menu</a>

            <a href="#wine">Wine</a>

            <a href="#about">About</a>

            <a href="#private-dining">
                Private Dining
            </a>

        </nav>


        <!-- Booking -->
        <a
            href="#booking"
            class="header-booking"
        >
            Book a Table
        </a>


        <!-- Mobile Menu -->
        <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            <span class="menu-icon"></span>
        </button>

    </div>
        <!-- Mobile Navigation -->
<nav
    class="mobile-nav"
    aria-label="Mobile navigation"
    aria-hidden="true"
>
    <div class="mobile-nav__inner">

        <div class="mobile-nav__top">
            <span class="mobile-nav__label">DOPPO</span>

            <button
                class="mobile-nav__close"
                type="button"
                aria-label="Close navigation menu"
            >
                ×
            </button>
        </div>

        <div class="mobile-nav__links">

            <a href="#menu">Menu</a>

            <a href="#wine">Wine</a>

            <a href="#about">About</a>

            <a href="#private-dining">
                Private Dining
            </a>

        </div>

        <a
            href="#booking"
            class="mobile-nav__booking"
        >
            Book a Table
        </a>

    </div>
    </nav>

    </header>

    <main>
        <section class="hero" id="home">

    <!-- Hero Media -->
    <div class="hero__media" aria-hidden="true">
        <img
            src="doppo-hero.jpg"
            alt=""
        >
    </div>


    <!-- Hero Overlay -->
    <div
        class="hero__overlay"
        aria-hidden="true"
    ></div>


    <!-- Hero Content -->
    <div class="hero__content">

        <div class="container">

            <p class="eyebrow hero__eyebrow">
                Doppo · Dean Street
            </p>

            <h1 class="hero__title">
                Italian cooking.<br>
                Soho energy.
            </h1>

            <div class="hero__footer">

                <p class="hero__location">
                    33 Dean Street,<br>
                    Soho, London
                </p>

                <a
                    href="#about"
                    class="hero__scroll"
                >
                    <span class="hero__scroll-line"></span>
                    <span>Explore</span>
                </a>

            </div>

        </div>

    </div>

        </section>

    </main>

    <script src="main.js"></script>
    <script src="navigation.js"></script>

</body>

</html>
